# snapclient 설정 (아이폰 한 대 = 노드 하나)
# 바꾼 뒤:  sudo snapclient-ctl restart
NAME=node-01            # Snapcast 서버에 보일 이름 (폰마다 다르게: node-01 ~ node-07)
SERVER=                 # 비우면 Bonjour로 Mac 서버 자동 검색, 예: 192.168.1.10
CHANNEL=-1              # -1 = 받은 채널 그대로, 0~6 = 7채널 스트림에서 이 채널만 양쪽 스피커로
LATENCY=0               # 이 폰의 출력 지연 보정(ms). 측정 후 서버에서 바꾸는 것을 권장
EXTRA_ARGS=
KEEPAWAKE=1             # 1 = 화면이 꺼져도 폰이 잠들지 않게(서버 재접속 빠름), 0 = 끔
STATS=0                 # 1 = 1초마다 동기 상태를 로그에 남김(진단용)
