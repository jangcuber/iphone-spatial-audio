# 시험 A — 같은 스트림을 아이폰 2대가 재생 (Snapcast 기준선)
# 실행:  snapserver -c tools/config/snapserver_test_a.conf
# 버전에 따라 키 이름이 다를 수 있으니 `snapserver --version`과 기본 설정 파일을 먼저 확인하세요.
# 제어(JSON-RPC) 포트는 기본 1705, 오디오 스트리밍 포트는 기본 1704 (기본값 그대로 사용).

# idle_threshold=5000: chirp 사이 무음(0.5 s)마다 스트림이 idle↔playing으로 바뀌는 것을 막는다
#   (2026-10-08 첫 실행 로그에서 775회 전환 확인. 오디오 전달 자체는 idle이어도 계속됨 — asio_stream.hpp)
[stream]
# fanout이 이 FIFO에 실시간 속도로 16-bit/48 kHz/2ch PCM을 써 넣는다.
source = pipe:///tmp/snap_test_a?name=TestA&mode=create&sampleformat=48000:16:2&idle_threshold=5000

# pcm: 코덱 지연·디코딩 부하 없음 (flac은 평균 ~26 ms 추가). LAN 대역폭은 충분.
codec = pcm
chunk_ms = 20
# 서버 캡처 → 폰 재생까지의 목표 지연(ms). 먼저 넉넉히, 결과를 본 뒤 줄여 본다.
buffer = 1000
# solo 순환에서 mute된 폰에도 계속 스트림을 보내 재합류 때 재동기화가 생기지 않게 한다.
send_to_muted = true
