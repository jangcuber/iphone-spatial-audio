# 7채널(FL FR C SL SR HL HR) 한 스트림 — 모든 폰이 같은 스트림·시간축을 받고 폰마다 CHANNEL(0~6)로 하나만 재생
#   python3 -m spatial_tools fanout signal.schedule.json --out /tmp/snap_7ch:multi
#   (채널마다 pipe를 따로 두는 snapserver_7ch.conf 방식은 pipe마다 타임스탬프가 따로 붙어 offset이 생길 수 있음)
[stream]
source = pipe:///tmp/snap_7ch?name=Ch7&mode=create&sampleformat=48000:16:7&idle_threshold=5000
codec = pcm
chunk_ms = 20
buffer = 1000
send_to_muted = true
