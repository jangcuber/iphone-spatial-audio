# 7대 5.0.2 — 채널마다 독립 스트림 (시험 B가 성립한 뒤 사용)
#   python3 -m spatial_tools fanout signals/s7.schedule.json \
#     --out /tmp/snap_FL:0 --out /tmp/snap_FR:1 --out /tmp/snap_C:2 --out /tmp/snap_SL:3 \
#     --out /tmp/snap_SR:4 --out /tmp/snap_HL:5 --out /tmp/snap_HR:6
#   python3 -m spatial_tools snap assign --map node-01=FL,node-02=FR,node-03=C,node-04=SL,node-05=SR,node-06=HL,node-07=HR

# idle_threshold=5000: chirp 사이 무음(0.5 s)마다 스트림이 idle↔playing으로 바뀌는 것을 막는다
#   (2026-10-08 첫 실행 로그에서 775회 전환 확인. 오디오 전달 자체는 idle이어도 계속됨 — asio_stream.hpp)
[stream]
source = pipe:///tmp/snap_FL?name=FL&mode=create&sampleformat=48000:16:2&idle_threshold=5000
source = pipe:///tmp/snap_FR?name=FR&mode=create&sampleformat=48000:16:2&idle_threshold=5000
source = pipe:///tmp/snap_C?name=C&mode=create&sampleformat=48000:16:2&idle_threshold=5000
source = pipe:///tmp/snap_SL?name=SL&mode=create&sampleformat=48000:16:2&idle_threshold=5000
source = pipe:///tmp/snap_SR?name=SR&mode=create&sampleformat=48000:16:2&idle_threshold=5000
source = pipe:///tmp/snap_HL?name=HL&mode=create&sampleformat=48000:16:2&idle_threshold=5000
source = pipe:///tmp/snap_HR?name=HR&mode=create&sampleformat=48000:16:2&idle_threshold=5000
codec = pcm
chunk_ms = 20
buffer = 1000
send_to_muted = true
