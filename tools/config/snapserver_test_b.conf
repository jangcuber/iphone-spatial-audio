# 시험 B — 아이폰 2대에 서로 다른 채널(독립 스트림) 보내기
# fanout이 두 FIFO에 같은 frame을 같은 순간에 써 넣는다.
#   python3 -m spatial_tools fanout signals/test_b.schedule.json --out /tmp/snap_L:0 --out /tmp/snap_R:1
# 클라이언트 배정:
#   python3 -m spatial_tools snap assign --map P1=chL,P2=chR

# idle_threshold=5000: chirp 사이 무음(0.5 s)마다 스트림이 idle↔playing으로 바뀌는 것을 막는다
#   (2026-10-08 첫 실행 로그에서 775회 전환 확인. 오디오 전달 자체는 idle이어도 계속됨 — asio_stream.hpp)
[stream]
source = pipe:///tmp/snap_L?name=chL&mode=create&sampleformat=48000:16:2&idle_threshold=5000
source = pipe:///tmp/snap_R?name=chR&mode=create&sampleformat=48000:16:2&idle_threshold=5000
codec = pcm
chunk_ms = 20
buffer = 1000
send_to_muted = true
